name: Build and deploy site

# Builds the portfolio and /blog from their sources, runs tests and
# syntax/design/HTML checks, and deploys the result to GitHub Pages.
# Generated pages are not committed; this workflow is the only publisher.
#
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep __pycache__ out of the published artifact.
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-blog.txt

      # Only used when a post has a Mermaid diagram that was not rendered and
      # committed locally (renders are cached in content/blog/diagrams/).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install build dependencies
        run: pip install -r scripts/requirements-blog.txt

      # The unit tests read the generated search index and blog pages,
      # so the site is built first.
      - name: Build
        run: python3 scripts/blog.py build

      - name: Unit tests and JavaScript syntax
        run: python3 scripts/blog.py test

      - name: Freshness, design and HTML checks
        run: python3 scripts/blog.py check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
