name: Build blog

# Regenerates /blog (plus sitemap.xml, robots.txt and the Writing section of
# index.html) from content/blog/*.md, runs the tests and the design/HTML
# checks, and commits the output if it changed. Replaces the old Hashnode RSS
# sync: the posts now live in this repository.
#
# Needs Settings > Actions > General > Workflow permissions: "Read and write".
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'blog/assets/**'
      - 'index.html'
      - '.github/workflows/blog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-blog.txt

      # Only used when a post has a Mermaid diagram that was not rendered and
      # committed locally (renders are cached in content/blog/diagrams/).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: pip install -r scripts/requirements-blog.txt

      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build
        run: python3 scripts/build_blog.py

      - name: Design and HTML checks
        run: python3 scripts/check.py

      - name: Commit generated output if changed
        run: |
          git add -A blog content/blog/diagrams sitemap.xml robots.txt index.html
          if git diff --cached --quiet; then
            echo "Generated output already up to date."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: rebuild blog'
          git push
