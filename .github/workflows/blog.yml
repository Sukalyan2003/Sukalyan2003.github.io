name: Build site

# Regenerates the portfolio and /blog from their content records, runs tests and
# syntax/design/HTML checks, and commits generated output if it changed.
#
# Needs Settings > Actions > General > Workflow permissions: "Read and write".
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'blog/assets/**'
      - 'assets/**'
      - 'js/**'
      - 'index.html'
      - '.github/workflows/blog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-blog.txt

      # Only used when a post has a Mermaid diagram that was not rendered and
      # committed locally (renders are cached in content/blog/diagrams/).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install build dependencies
        run: pip install -r scripts/requirements-blog.txt

      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: JavaScript syntax
        run: |
          for file in assets/record/js/*.js blog/assets/*.js js/*.js; do
            node --check "$file"
          done

      - name: Build
        run: python3 scripts/blog.py build

      - name: Design and HTML checks
        run: python3 scripts/check.py

      - name: Commit generated output if changed
        run: |
          git add -A blog sitemap.xml robots.txt index.html work about library
          # content/blog/diagrams only exists once a post has a Mermaid diagram;
          # git add fails on a missing path, so add it only when present.
          if [ -d content/blog/diagrams ]; then git add -A content/blog/diagrams; fi
          if git diff --cached --quiet; then
            echo "Generated output already up to date."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: rebuild blog'
          git push
