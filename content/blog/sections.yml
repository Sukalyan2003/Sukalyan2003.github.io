# Blog navigation, in display order. This file is the single source of truth
# for the section bar on every blog page.
#
#   slug         URL segment: /blog/<slug>/ (lowercase, hyphens)
#   label        text shown in the nav
#   nav          primary = shown in the bar; more = inside a "More" menu
#                (all sections are in the bar today, so no menu is shown)
#   description  one or two sentences shown at the top of the section page
#   series       true = posts are an ordered series; each needs seriesOrder
#   page         a Markdown file under content/blog/ rendered instead of a
#                post list (used by Start here)
#
# Posts join a section with `section: <slug>` in their front matter.
# See BLOG.md (local, not committed) or `python3 scripts/blog.py --help`.

- slug: start-here
  label: Start here
  nav: primary
  page: pages/start-here.md

- slug: linux
  label: Linux
  nav: primary
  description: Working notes from the terminal - Vim, shell scripting and process synchronisation.

- slug: aiml
  label: AIML
  nav: primary
  description: Neural networks, LLMs, retrieval-augmented generation, evals and AI-assisted development.

- slug: unsung-bits
  label: Unsung Bits
  nav: primary
  series: true
  description: Wildly underrated CS (and proto-CS) contributions by Indians and people of Indian origin, explained one topic at a time.

- slug: programming-concepts
  label: Programming Concepts
  nav: primary
  description: Pointers, command-line tools and interpreters, worked through in code.

- slug: moocs
  label: Moocs
  nav: primary
  description: Notes from online courses - CS50, CS50 AI and Nand2Tetris.
